<!-- Carrinho lateral compartilhado (o cabeçalho é montado por js/header.js) -->
<aside id="cart-panel" class="cart-panel hidden" aria-labelledby="cart-title">
  <div class="cart-header">
    <h2 id="cart-title">Seu Carrinho</h2>
    <button id="cart-close" type="button" class="cart-close" aria-label="Fechar carrinho"><span aria-hidden="true">✕</span></button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">Total: <span id="cart-total">R$ 0,00</span></div>
    <div class="cart-controls">
      <button id="clear-cart" class="btn btn-orange btn-left"><span class="btn-line">Limpar<br>carrinho</span></button>
      <button id="checkout" class="btn btn-green btn-right" disabled><span class="btn-line">Finalizar via<br>WhatsApp</span></button>
    </div>
    <div class="cart-controls cart-controls-site">
      <button id="checkout-site" class="btn btn-blue btn-right" disabled><span class="btn-line">Finalizar<br>no site</span></button>
    </div>
    <div class="cart-actions">
      <label for="payment" style="display:block;margin-top:8px;font-weight:700">Pagamento:</label>
      <div class="payment-row" style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <select id="payment" autocomplete="off" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd">
          <option value="">Selecione</option>
          <option value="PIX">PIX</option>
          <option value="DEBITO">DÉBITO</option>
          <option value="CREDITO">CRÉDITO</option>
          <option value="DINHEIRO">DINHEIRO</option>
          <option value="BANESE_CREDITO">BANESE CRÉDITO</option>
          <option value="BANESE_DEBITO">BANESE DÉBITO</option>
          <option value="LINK">LINK DE PAGAMENTO</option>
        </select>
      </div>
      <div id="cash-change" class="hidden" style="margin-top:8px">
        <label for="need-change">Precisa de troco? <select id="need-change"><option value="no">Não</option><option value="yes">Sim</option></select></label>
        <div id="cash-amount-row" class="hidden" style="margin-top:8px"><label for="cash-amount">Valor que irá pagar:</label> <input id="cash-amount" type="text" inputmode="decimal" placeholder="ex: 200.00" style="padding:8px;border-radius:6px;border:1px solid #ddd;width:100%"></div>
      </div>
      <div class="checkout-delivery">
        <p class="checkout-section-title" id="delivery-title" style="margin:0 0 4px;font-weight:700">Confirmar endereço de entrega:</p>
        <div class="checkout-grid two-cols">
          <label for="checkout-street" class="sr-only">Rua</label>
          <input id="checkout-street" type="text" placeholder="Rua" autocomplete="address-line1">
          <label for="checkout-number" class="sr-only">Número</label>
          <input id="checkout-number" type="text" placeholder="Número" autocomplete="address-line2">
          <label for="checkout-neighborhood" class="sr-only">Bairro</label>
          <input id="checkout-neighborhood" type="text" placeholder="Bairro" autocomplete="address-level2">
          <label for="checkout-zip" class="sr-only">CEP</label>
          <input id="checkout-zip" type="text" inputmode="numeric" placeholder="CEP" autocomplete="postal-code">
        </div>
        <label for="checkout-reference" class="sr-only">Referência (opcional)</label>
        <input id="checkout-reference" type="text" placeholder="Referência (opcional)">
      </div>
      <div class="checkout-schedule">
        <p class="checkout-section-title" id="schedule-title" style="margin:0 0 4px;font-weight:700">Agendamento da entrega:</p>
        <div class="checkout-grid two-cols">
          <label for="delivery-date" class="sr-only">Data da entrega</label><input id="delivery-date" type="date">
          <label for="delivery-window" class="sr-only">Horário da entrega</label><select id="delivery-window">
            <option value="">Selecione o horário</option>
            <option value="09:00-11:00">09:00 às 11:00</option>
            <option value="13:00-15:00">13:00 às 15:00</option>
            <option value="15:00-18:00">15:00 às 18:00</option>
          </select>
        </div>
      </div>
      <p id="checkout-site-hint" class="checkout-site-hint" role="note">Checkout no site pronto para integração com gateway PIX/cartão.</p>
    </div>
  </div>
</aside>
